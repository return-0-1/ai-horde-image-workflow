# --- LoRA 白名单（手动配置可用的 LoRA） ---
# 每个条目必须包含：
#   - name:            显示名称
#   - version_id:      AI Horde 使用的版本 ID（字符串）
#   - keywords:        用于匹配的关键词（中文/英文）
#   - trigger_words:   触发词列表
#   - base_model:      基础模型（SD1.5 / SDXL / Flux 等）
#   - strength_model:  模型权重（0-1），默认 0.8
#   - strength_clip:   CLIP 权重（0-1），默认 0.8
#   - model_id:        （可选）CivitAI model_id，用于获取在线元数据
#
# 示例配置（请根据实际修改）：
# --- LoRA 自动搜索设置 ---
lora_search:
  max_results: 10                        # 每个关键词搜索结果数
  max_loras: 2                           # 最终提交 LoRA 数量上限
  min_score: 3                           # LLM 审核最低通过分 (1-10)

